name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 运行测试套件
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: |
          cd app && npm install --no-audit --no-fund
          cd ../tools && npm install --no-audit --no-fund

      - name: 端到端测试
        run: node tools/e2e-test.js

      - name: 深度测试
        run: node tools/advanced-test.js

      - name: 界面渲染测试
        run: node tools/ui-test.js

      - name: 按钮全覆盖测试
        run: node tools/buttons-test.js
